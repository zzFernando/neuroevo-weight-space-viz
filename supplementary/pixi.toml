[workspace]
name = "neuroevo-weight-space-viz"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.11.*"
matplotlib = "3.8.4.*"
numpy = "1.26.4.*"
plotly = "5.24.1.*"
scikit-learn = "1.4.2.*"
streamlit = "1.50.0.*"
umap-learn = "0.5.7.*"
numba = ">=0.60,<1"
tectonic = ">=0.16.9,<0.17"
datashader = ">=0.16"
colorcet = ">=3.0"
pandas = ">=2.0"
scipy = ">=1.12"
panel = ">=1.4"
holoviews = ">=1.19"
bokeh = ">=3.4"

[pypi-dependencies]
scienceplots = ">=2.1"

[tasks]
app = "python -m streamlit run app.py"
figs = "python generate_figs.py"
alignment-demo = "python generate_alignment_demo.py"
viz-brax = "panel serve ../brax/interactive_datashader.py --show --autoreload --port 5007"
brax-analysis = "python experiments/brax_adapter.py"
brax-openES   = "python experiments/brax_adapter.py --algo open_es"
brax-cmaes    = "python experiments/brax_adapter.py --algo cma_es"
brax-simplega = "python experiments/brax_adapter.py --algo simple_ga"
exp1-all = "python experiments/01_multi_seed_robustness.py"
watch-run = "python ../brax/watch_run.py"
