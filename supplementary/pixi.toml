[workspace]
name = "neuroevo-weight-space-viz"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.11.*"
matplotlib = "3.8.4.*"
numpy = "1.26.4.*"
plotly = "5.24.1.*"
scikit-learn = "1.4.2.*"
streamlit = "1.50.0.*"
umap-learn = "0.5.7.*"
numba = ">=0.60,<1"
tectonic = ">=0.16.9,<0.17"

[tasks]
app = "streamlit run app.py"
figs = "python generate_figs.py"
alignment-demo = "python generate_alignment_demo.py"
